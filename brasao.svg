<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="700" height="950">
  <defs>
    <!-- Gold Metallic Shield Base Color -->
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B85D" />
      <stop offset="50%" stop-color="#C7A74B" />
      <stop offset="100%" stop-color="#B19039" />
    </linearGradient>

    <!-- Banner Color -->
    <linearGradient id="bannerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7CD78" />
      <stop offset="50%" stop-color="#D1AF51" />
      <stop offset="100%" stop-color="#B79135" />
    </linearGradient>

    <!-- Sword Blade Silver -->
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Brick/Hatched Pattern for Crossguards & Scale Pans -->
    <pattern id="brickPattern" width="12" height="7" patternUnits="userSpaceOnUse">
      <rect width="12" height="7" fill="#E8C53A" />
      <line x1="0" y1="0" x2="12" y2="0" stroke="#806210" stroke-width="0.9" />
      <line x1="0" y1="3.5" x2="12" y2="3.5" stroke="#806210" stroke-width="0.9" />
      <line x1="6" y1="0" x2="6" y2="3.5" stroke="#806210" stroke-width="0.9" />
      <line x1="0" y1="3.5" x2="0" y2="7" stroke="#806210" stroke-width="0.9" />
    </pattern>

    <!-- Curved Text Paths for Banners -->
    <path id="topTextArc" d="M 145 282 Q 350 352, 555 282" fill="none" />
    <path id="bottomTextArc" d="M 145 700 Q 350 770, 555 700" fill="none" />
  </defs>

  <!-- 1. MAIN SHIELD OUTLINE (Exact PCCE Badge Contour with broad rounded base) -->
  <path d="M 350 128
           C 290 128, 220 98, 160 112
           C 120 122, 85 148, 62 188
           C 96 235, 118 282, 90 348
           C 62 414, 74 485, 120 555
           C 166 625, 240 702, 300 760
           C 325 784, 338 792, 350 792
           C 362 792, 375 784, 400 760
           C 460 702, 534 625, 580 555
           C 626 485, 638 414, 610 348
           C 582 282, 604 235, 638 188
           C 615 148, 580 122, 540 112
           C 480 98, 410 128, 350 128 Z"
        fill="#C8A74A"
        stroke="#1A1813"
        stroke-width="6"
        stroke-linejoin="round" />

  <!-- Inner contour line -->
  <path d="M 350 138
           C 293 138, 225 109, 168 122
           C 130 131, 97 155, 75 192
           C 107 236, 128 280, 101 343
           C 74 406, 85 474, 128 541
           C 171 608, 242 682, 300 738
           C 323 760, 335 768, 350 768
           C 365 768, 377 760, 400 738
           C 458 682, 529 608, 572 541
           C 615 474, 626 406, 599 343
           C 572 280, 593 236, 625 192
           C 603 155, 570 131, 532 122
           C 475 109, 407 138, 350 138 Z"
        fill="none"
        stroke="#1A1813"
        stroke-width="1.8"
        opacity="0.35" />

  <!-- 2. CENTRAL GREEN LEAF / TEARDROP FIELD -->
  <path d="M 350 270
           C 425 270, 500 340, 506 435
           C 512 530, 425 595, 350 595
           C 275 595, 188 530, 194 435
           C 200 340, 275 270, 350 270 Z"
        fill="#3B7D45"
        stroke="#1A4220"
        stroke-width="3.2" />

  <!-- 3. LAUREL WREATHS WITH RED BERRIES -->
  <!-- Left Branch -->
  <g fill="#2B6635" stroke="#14381B" stroke-width="2">
    <path d="M 190 282 C 155 295, 169 328, 196 315 Z" />
    <path d="M 176 325 C 141 338, 155 371, 182 358 Z" />
    <path d="M 169 373 C 134 386, 148 419, 175 406 Z" />
    <path d="M 166 422 C 131 435, 145 468, 172 455 Z" />
    <path d="M 169 472 C 134 485, 148 518, 175 505 Z" />
    <path d="M 181 522 C 146 535, 163 568, 190 549 Z" />
    <!-- Stem -->
    <path d="M 202 282 Q 161 415, 204 550" fill="none" stroke="#14381B" stroke-width="4.5" />
    <!-- Red Berries -->
    <circle cx="184" cy="302" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="170" cy="350" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="163" cy="399" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="160" cy="449" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="166" cy="498" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="179" cy="543" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
  </g>

  <!-- Right Branch -->
  <g fill="#2B6635" stroke="#14381B" stroke-width="2">
    <path d="M 510 282 C 545 295, 531 328, 504 315 Z" />
    <path d="M 524 325 C 559 338, 545 371, 518 358 Z" />
    <path d="M 531 373 C 566 386, 552 419, 525 406 Z" />
    <path d="M 534 422 C 569 435, 555 468, 528 455 Z" />
    <path d="M 531 472 C 566 485, 552 518, 525 505 Z" />
    <path d="M 519 522 C 554 535, 537 568, 510 549 Z" />
    <!-- Stem -->
    <path d="M 498 282 Q 539 415, 496 550" fill="none" stroke="#14381B" stroke-width="4.5" />
    <!-- Red Berries -->
    <circle cx="516" cy="302" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="530" cy="350" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="537" cy="399" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="540" cy="449" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="534" cy="498" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
    <circle cx="521" cy="543" r="6.5" fill="#D32F2F" stroke="#7A1313" stroke-width="1.5" />
  </g>

  <!-- 4. VERTICAL SWORD -->
  <!-- Blade -->
  <path d="M 342 210 L 358 210 L 356 670 L 350 690 L 344 670 Z" fill="url(#swordBlade)" stroke="#1E293B" stroke-width="2.5" />
  <line x1="350" y1="210" x2="350" y2="670" stroke="#94A3B8" stroke-width="2.5" />
  <!-- Handle -->
  <rect x="339" y="218" width="22" height="34" fill="#4A2A18" stroke="#1E293B" stroke-width="2.5" rx="3" />

  <!-- Upper Guard Crescent (Brick pattern) -->
  <path d="M 275 272 Q 350 245, 425 272 Q 350 290, 275 272 Z" fill="url(#brickPattern)" stroke="#1A1813" stroke-width="3" />

  <!-- Lower Guard Crescent (Brick pattern) -->
  <path d="M 275 318 Q 350 291, 425 318 Q 350 338, 275 318 Z" fill="url(#brickPattern)" stroke="#1A1813" stroke-width="3" />

  <!-- 5. SCALES OF JUSTICE -->
  <g stroke="#1A1813" stroke-width="3">
    <!-- Left Scale Pan & Strings -->
    <line x1="245" y1="335" x2="200" y2="420" stroke="#1E293B" stroke-width="2" />
    <line x1="245" y1="335" x2="290" y2="420" stroke="#1E293B" stroke-width="2" />
    <path d="M 195 420 Q 245 462, 295 420 Z" fill="url(#brickPattern)" stroke="#1A1813" stroke-width="2.5" />

    <!-- Right Scale Pan & Strings -->
    <line x1="455" y1="335" x2="410" y2="420" stroke="#1E293B" stroke-width="2" />
    <line x1="455" y1="335" x2="500" y2="420" stroke="#1E293B" stroke-width="2" />
    <path d="M 405 420 Q 455 462, 505 420 Z" fill="url(#brickPattern)" stroke="#1A1813" stroke-width="2.5" />
  </g>

  <!-- 6. CENTRAL OVAL SEAL (SELO DO ESTADO DO CEARÁ) -->
  <g id="seloCeara">
    <ellipse cx="350" cy="460" rx="60" ry="88" fill="#52B2EC" stroke="#1E293B" stroke-width="3.5" />
    <clipPath id="ovalClip">
      <ellipse cx="350" cy="460" rx="57" ry="85" />
    </clipPath>

    <g clip-path="url(#ovalClip)">
      <!-- Top Left: Sky Blue with Sun Rays and Farol do Mucuripe -->
      <path d="M 280 372 L 350 460 L 280 548 Z" fill="#60A5FA" />
      <g stroke="#FACC15" stroke-width="3" opacity="0.9">
        <line x1="350" y1="460" x2="290" y2="385" />
        <line x1="350" y1="460" x2="315" y2="385" />
        <line x1="350" y1="460" x2="338" y2="385" />
        <line x1="350" y1="460" x2="285" y2="410" />
        <line x1="350" y1="460" x2="285" y2="435" />
      </g>
      <!-- Farol do Mucuripe -->
      <g stroke="#1E293B" stroke-width="1.8" fill="#FFFFFF">
        <rect x="311" y="396" width="15" height="46" rx="1" />
        <rect x="311" y="408" width="15" height="8" fill="#1E293B" />
        <rect x="311" y="427" width="15" height="8" fill="#1E293B" />
        <path d="M 307 396 L 330 396 L 318 385 Z" fill="#F59E0B" />
      </g>

      <!-- Top Right: Sky, Green Mountain & White Seagull -->
      <path d="M 350 372 L 420 372 L 420 460 L 350 460 Z" fill="#7DD3FC" />
      <path d="M 350 460 L 390 405 Q 411 430, 420 460 Z" fill="#3B7D45" stroke="#1E293B" stroke-width="1.5" />
      <path d="M 366 402 Q 379 389, 390 400 Q 402 389, 413 402 Q 402 397, 390 405 Q 379 397, 366 402 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />

      <!-- Bottom Left: Ocean Blue Water & Jangada Raft -->
      <path d="M 280 460 L 350 460 L 350 548 L 280 548 Z" fill="#38BDF8" />
      <g stroke="#1E293B" stroke-width="1.8">
        <path d="M 306 518 L 334 518 L 329 524 L 308 524 Z" fill="#78350F" />
        <path d="M 319 491 L 319 515 L 303 511 Z" fill="#FFFFFF" />
      </g>

      <!-- Bottom Right: Sandy Beach & Carnaúba Palm Tree -->
      <path d="M 350 460 L 420 460 L 420 548 L 350 548 Z" fill="#D0B083" />
      <g stroke="#1E293B" stroke-width="1.5">
        <path d="M 380 540 Q 385 498, 382 484" fill="none" stroke="#5C3A21" stroke-width="3.8" />
        <path d="M 382 484 Q 364 470, 357 480 M 382 484 Q 368 462, 372 451 M 382 484 Q 389 457, 398 452 M 382 484 Q 405 467, 408 478" fill="none" stroke="#27532D" stroke-width="3.2" />
      </g>
    </g>

    <!-- Golden Rim -->
    <ellipse cx="350" cy="460" rx="60" ry="88" fill="none" stroke="#E8C53A" stroke-width="4.5" />
    <ellipse cx="350" cy="460" rx="60" ry="88" fill="none" stroke="#1A1813" stroke-width="2" />
  </g>

  <!-- 7. TOP BANNER (POLÍCIA) -->
  <g id="topBanner">
    <!-- Ribbon Tail Left -->
    <path d="M 145 195 L 110 228 L 145 261 L 178 241 L 178 207 Z" fill="#9E7A2A" stroke="#1A1813" stroke-width="3.2" />
    <!-- Ribbon Tail Right -->
    <path d="M 555 195 L 590 228 L 555 261 L 522 241 L 522 207 Z" fill="#9E7A2A" stroke="#1A1813" stroke-width="3.2" />
    <!-- Ribbon Fold Shadow Left -->
    <path d="M 178 241 L 178 265 L 198 253 Z" fill="#5E4717" stroke="#1A1813" stroke-width="2" />
    <!-- Ribbon Fold Shadow Right -->
    <path d="M 522 241 L 522 265 L 502 253 Z" fill="#5E4717" stroke="#1A1813" stroke-width="2" />

    <!-- Main Curved Banner Body -->
    <path d="M 145 188 
             Q 350 258, 555 188 
             L 567 261 
             Q 350 331, 133 261 Z" 
          fill="url(#bannerGold)" 
          stroke="#1A1813" 
          stroke-width="4" />

    <!-- Curved Text POLÍCIA -->
    <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="64" fill="#1F1D17" letter-spacing="5">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">POLÍCIA</textPath>
    </text>
  </g>

  <!-- 8. BOTTOM BANNER (CIVIL) -->
  <g id="bottomBanner">
    <!-- Ribbon Tail Left -->
    <path d="M 145 612 L 110 645 L 145 678 L 178 658 L 178 624 Z" fill="#9E7A2A" stroke="#1A1813" stroke-width="3.2" />
    <!-- Ribbon Tail Right -->
    <path d="M 555 612 L 590 645 L 555 678 L 522 658 L 522 624 Z" fill="#9E7A2A" stroke="#1A1813" stroke-width="3.2" />
    <!-- Ribbon Fold Shadow Left -->
    <path d="M 178 658 L 178 682 L 198 670 Z" fill="#5E4717" stroke="#1A1813" stroke-width="2" />
    <!-- Ribbon Fold Shadow Right -->
    <path d="M 522 658 L 522 682 L 502 670 Z" fill="#5E4717" stroke="#1A1813" stroke-width="2" />

    <!-- Main Curved Banner Body -->
    <path d="M 145 605 
             Q 350 675, 555 605 
             L 567 678 
             Q 350 748, 133 678 Z" 
          fill="url(#bannerGold)" 
          stroke="#1A1813" 
          stroke-width="4" />

    <!-- Curved Text CIVIL -->
    <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="68" fill="#1F1D17" letter-spacing="6">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">CIVIL</textPath>
    </text>
  </g>

  <!-- 9. BOTTOM TEXT (CE) -->
  <text x="350" y="828" 
        font-family="'Arial Black', Arial, sans-serif" 
        font-weight="900" 
        font-size="54" 
        fill="#1F1D17" 
        text-anchor="middle" 
        letter-spacing="4">CE</text>
</svg>