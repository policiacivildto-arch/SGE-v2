<svg viewBox="0 0 400 500" width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="swordSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cearaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cearaSea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Outline (Polícia Civil do Ceará) -->
  <g>
    <!-- Outer Gold Shield -->
    <path d="M 200 20 
             C 270 20, 340 50, 360 80
             C 380 140, 370 250, 350 310
             C 320 390, 240 450, 200 480
             C 160 450, 80 390, 50 310
             C 30 250, 20 140, 40 80
             C 60 50, 130 20, 200 20 Z" 
          fill="url(#shieldGold)" stroke="#78350f" stroke-width="6" />

    <!-- Inner Green Field (Fundo Verde do Brasão) -->
    <path d="M 200 35 
             C 260 35, 325 62, 342 90
             C 360 142, 350 240, 332 295
             C 305 368, 235 422, 200 450
             C 165 422, 95 368, 68 295
             C 50 240, 40 142, 58 90
             C 75 62, 140 35, 200 35 Z" 
          fill="#15803d" stroke="#fef08a" stroke-width="3" />
  </g>

  <!-- Laurel Leaves -->
  <g fill="#16a34a" stroke="#14532d" stroke-width="1">
    <path d="M 100 180 Q 70 210, 85 240 Q 105 210, 100 180 Z" />
    <path d="M 90 220 Q 60 250, 75 280 Q 95 250, 90 220 Z" />
    <path d="M 85 260 Q 58 290, 78 320 Q 95 290, 85 260 Z" />
    <path d="M 90 300 Q 70 330, 95 355 Q 105 330, 90 300 Z" />
    <circle cx="95" cy="210" r="4" fill="#dc2626" />
    <circle cx="85" cy="250" r="4" fill="#dc2626" />
    <circle cx="82" cy="290" r="4" fill="#dc2626" />
    <circle cx="92" cy="330" r="4" fill="#dc2626" />
  </g>

  <g fill="#16a34a" stroke="#14532d" stroke-width="1">
    <path d="M 300 180 Q 330 210, 315 240 Q 295 210, 300 180 Z" />
    <path d="M 310 220 Q 340 250, 325 280 Q 305 250, 310 220 Z" />
    <path d="M 315 260 Q 342 290, 322 320 Q 305 290, 315 260 Z" />
    <path d="M 310 300 Q 330 330, 305 355 Q 295 330, 310 300 Z" />
    <circle cx="305" cy="210" r="4" fill="#dc2626" />
    <circle cx="315" cy="250" r="4" fill="#dc2626" />
    <circle cx="318" cy="290" r="4" fill="#dc2626" />
    <circle cx="308" cy="330" r="4" fill="#dc2626" />
  </g>

  <!-- Vertical Sword -->
  <g>
    <path d="M 194 90 L 206 90 L 204 430 L 200 445 L 196 430 Z" fill="url(#swordSilver)" stroke="#475569" stroke-width="1.5" />
    <line x1="200" y1="90" x2="200" y2="430" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 170 145 Q 200 135, 230 145 Q 200 155, 170 145 Z" fill="#d97706" stroke="#78350f" stroke-width="2" />
    <rect x="193" y="115" width="14" height="25" fill="#78350f" rx="3" />
    <circle cx="200" cy="110" r="8" fill="#d97706" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Scales of Justice -->
  <g stroke="#b45309" stroke-width="2" fill="none">
    <path d="M 140 185 L 200 150 L 260 185" stroke="#d97706" stroke-width="4" />
    <line x1="140" y1="185" x2="120" y2="245" />
    <line x1="140" y1="185" x2="160" y2="245" />
    <path d="M 110 245 Q 140 265, 170 245 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    
    <line x1="260" y1="185" x2="240" y2="245" />
    <line x1="260" y1="185" x2="280" y2="245" />
    <path d="M 230 245 Q 260 265, 290 245 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Central Oval Seal -->
  <g id="seloCeara">
    <ellipse cx="200" cy="260" rx="42" ry="58" fill="url(#cearaSky)" stroke="#f59e0b" stroke-width="4" />
    <circle cx="215" cy="225" r="12" fill="#facc15" />
    <path d="M 210 215 Q 215 210, 220 215 Q 225 210, 230 215" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M 160 270 Q 185 245, 210 265 Q 230 250, 242 270 L 242 318 L 158 318 Z" fill="#16a34a" />
    <path d="M 158 280 C 170 285, 190 280, 200 290 C 210 300, 230 290, 242 318 L 158 318 Z" fill="url(#cearaSea)" />
    <rect x="172" y="252" width="8" height="26" fill="#ffffff" stroke="#334155" stroke-width="1" />
    <polygon points="170,252 176,244 182,252" fill="#dc2626" />
    <rect x="174" y="248" width="4" height="4" fill="#fef08a" />
    <path d="M 170 298 L 182 298 L 180 302 L 172 302 Z" fill="#78350f" />
    <path d="M 176 298 L 176 288 L 184 295 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
    <rect x="220" y="270" width="3" height="22" fill="#78350f" />
    <path d="M 221 270 Q 210 260, 208 265 M 221 270 Q 232 260, 234 265 M 221 270 Q 215 255, 218 252 M 221 270 Q 227 255, 224 252" stroke="#15803d" stroke-width="2.5" fill="none" />
    <ellipse cx="200" cy="260" rx="42" ry="58" fill="none" stroke="#fbbf24" stroke-width="2.5" />
  </g>

  <!-- Top Ribbon -->
  <g id="topRibbon">
    <polygon points="65,115 45,130 65,145 80,135" fill="#b45309" />
    <polygon points="335,115 355,130 335,145 320,135" fill="#b45309" />
    <path d="M 75 130 Q 200 100, 325 130 L 320 162 Q 200 132, 80 162 Z" fill="url(#ribbonGold)" stroke="#78350f" stroke-width="2" />
    <text x="200" y="146" font-family="sans-serif" font-weight="bold" font-size="26" fill="#0f172a" text-anchor="middle">POLÍCIA</text>
  </g>

  <!-- Bottom Ribbon -->
  <g id="bottomRibbon">
    <polygon points="85,385 65,400 85,415 100,405" fill="#b45309" />
    <polygon points="315,385 335,400 315,415 300,405" fill="#b45309" />
    <path d="M 95 395 Q 200 425, 305 395 L 300 428 Q 200 458, 100 428 Z" fill="url(#ribbonGold)" stroke="#78350f" stroke-width="2" />
    <text x="200" y="422" font-family="sans-serif" font-weight="bold" font-size="26" fill="#0f172a" text-anchor="middle">CIVIL</text>
  </g>

  <!-- Bottom Text CE -->
  <text x="200" y="472" font-family="sans-serif" font-weight="bold" font-size="22" fill="#1e293b" text-anchor="middle" letter-spacing="2">
    CE
  </text>
</svg>
