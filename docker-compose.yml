services:
  db:
    image: postgres:15-alpine
    container_name: sga_postgres_db
    restart: always
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: sga_django_backend
    restart: always
    secrets:
      - source: db_user
        target: db_user_SGA_BACK
      - source: db_password
        target: db_password_SGA_BACK
      - source: db_name
        target: db_name_SGA_BACK
      - source: django_secret_key
        target: django_secret_key_SGA_BACK
      - source: smtp_password
        target: smtp_password_SGA_BACK
    environment:
      # Padrão seguro por design: se DJANGO_DEBUG não for definido no .env,
      # sobe com DEBUG desligado — configure DJANGO_DEBUG=True só em
      # desenvolvimento local, nunca em produção.
      #
      # ALLOWED_HOSTS já vem correto por padrão como "backend": nesta
      # topologia o Django nunca é exposto direto (nem em dev nem em
      # produção, ver serviço `backend` abaixo — sem `ports:`) — quem
      # recebe requisição de fora é sempre o container `frontend`
      # (server.ts), que faz proxy com `changeOrigin: true` e por isso
      # SEMPRE reescreve o Host para "backend:8000" antes de repassar pro
      # Django, não importa o domínio público usado pelo navegador. Só
      # sobrescreva DJANGO_ALLOWED_HOSTS se você mudar essa topologia
      # (ex.: publicar a porta do backend direto no host).
      DEBUG: "${DJANGO_DEBUG:-False}"
      ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-backend}"
      DB_HOST: "db"
      DB_PORT: "5432"
      SMTP_HOST: "${SMTP_HOST:-smtp-mail.outlook.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sga_frontend
    restart: always
    environment:
      DJANGO_BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt

