version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sga_postgres_db
    restart: always
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: sga_python_backend
    restart: always
    secrets:
      - db_user
      - db_password
      - db_name
      - smtp_password
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "True"
      DB_HOST: "db"
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sga_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

