services:
  db:
    image: postgres:15-alpine
    container_name: sga_postgres_db
    restart: always
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_django:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: sga_django_backend
    restart: always
    secrets:
      - source: db_user
        target: db_user_SGA_BACK
      - source: db_password
        target: db_password_SGA_BACK
      - source: db_name
        target: db_name_SGA_BACK
      - source: django_secret_key
        target: django_secret_key_SGA_BACK
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_HOST: "db"
      DB_PORT: "5432"
    volumes:
      # Só para o management command migrar_db_json (import único e manual
      # dos dados legados) — não usado no boot normal do container.
      - ./db.json:/app/db.json:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sga_frontend
    restart: always
    secrets:
      - source: smtp_password
        target: SMTP_PASS_SGA_BACK
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp-mail.outlook.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      DJANGO_BACKEND_URL: "http://backend_django:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend_django

volumes:
  postgres_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt

