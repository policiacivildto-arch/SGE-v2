name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  secrets-check:
    name: Bloqueia segredos versionados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica que .env e secrets/*.txt não estão versionados
        run: |
          if git ls-files | grep -E '^\.env$|^secrets/.*\.txt$'; then
            echo "Arquivo de segredo encontrado versionado no repositório."
            exit 1
          fi
          echo "OK: nenhum arquivo de segredo versionado."
